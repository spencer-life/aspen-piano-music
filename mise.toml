[tools]
node = "24"
python = "3.13"

[tasks.install]
run = "npm install --no-audit --no-fund"

[tasks.ci]
depends = ["install"]
run = [
  "npm run typecheck",
  "npm test",
  "mise run site:ci",
  "python3 -m unittest discover -s backend/worker -p 'test_*.py'",
]

[tasks."site:ci"]
run = [
  "node --check site/app.js",
  "node --check site/webmcp.js",
  "test -s site/index.html",
  "test -s site/styles.css",
]

[tasks."worker:test"]
run = "python3 -m unittest discover -s backend/worker -p 'test_*.py'"

[tasks."worker:build"]
run = "docker build -f backend/worker/Dockerfile -t aspen-keys-worker ."

[tasks."runpod:provision"]
run = "node scripts/provision-runpod.mjs"

[tasks."runpod:smoke"]
run = "node scripts/smoke-runpod.mjs"

[tasks."agent:chrome"]
run = "npx -y chrome-devtools-mcp@latest --categoryExperimentalWebmcp=true --chromeArg=--enable-features=WebMCP --isolated=true"
