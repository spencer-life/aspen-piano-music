name: Visual review

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "netlify.toml"
      - ".github/workflows/visual-review.yml"
  workflow_dispatch:

concurrency:
  group: visual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start static preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site > /tmp/aspen-keys-http.log 2>&1 &
          retries=20
          until curl --fail --silent http://127.0.0.1:4173/ > /dev/null; do
            retries=$((retries - 1))
            if (( retries == 0 )); then
              cat /tmp/aspen-keys-http.log
              exit 1
            fi
            sleep 0.5
          done

      - name: Capture desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          chrome=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome="$candidate"
              break
            fi
          done
          if [[ -z "$chrome" ]]; then
            echo "No Chromium-based browser found on the runner." >&2
            exit 1
          fi

          mkdir -p visual-review
          common_args=(
            --headless=new
            --no-sandbox
            --disable-gpu
            --disable-dev-shm-usage
            --hide-scrollbars
          )

          "$chrome" "${common_args[@]}" --window-size=1440,1600 --screenshot=visual-review/desktop.png http://127.0.0.1:4173/
          "$chrome" "${common_args[@]}" --window-size=390,1400 --screenshot=visual-review/mobile.png http://127.0.0.1:4173/

          cat > visual-review/manifest.json <<'JSON'
          {
            "routes": [
              {
                "path": "/",
                "screenshots": ["desktop.png", "mobile.png"]
              }
            ]
          }
          JSON

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aspen-keys-visual-review
          path: visual-review
          if-no-files-found: error
          retention-days: 14
