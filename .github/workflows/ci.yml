name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/robots.txt"
      - "site/favicon.svg"
      - "site/manifest.webmanifest"
      - ".gitignore"
      - "renovate.json"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.detect.outputs.web }}
      worker: ${{ steps.detect.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        name: Detect affected surfaces
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          web=false
          worker=false

          while IFS= read -r file; do
            case "$file" in
              site/*.html|site/*.css|site/*.js|netlify/*|tests/*|package.json|tsconfig.json|netlify.toml)
                web=true
                ;;
              mise.toml)
                web=true
                worker=true
                ;;
            esac

            case "$file" in
              backend/worker/*|scripts/*)
                worker=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install dependencies
        run: npm install --package-lock=false --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate browser files
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app.js
          node --check site/webmcp.js
          test -s site/index.html
          test -s site/styles.css

  worker:
    name: Worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate worker and provisioning scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s backend/worker -p 'test_*.py'
          python3 -m py_compile scripts/verify-bundle.py
          node --check scripts/provision-runpod.mjs
          node --check scripts/smoke-runpod.mjs

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: gitleaks
        name: Scan committed secrets
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: actionlint
        name: Check GitHub Actions workflow correctness
        continue-on-error: true
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - id: zizmor
        name: Check GitHub Actions security
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

      - name: Enforce security baseline
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          set -euo pipefail
          status=0
          for check in "$GITLEAKS_OUTCOME" "$ACTIONLINT_OUTCOME" "$ZIZMOR_OUTCOME"; do
            if [[ "$check" != "success" ]]; then
              status=1
            fi
          done
          exit "$status"
