name: Netlify production deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "netlify/**"
      - "netlify.toml"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: 43c27623-7862-48c2-9f7f-c130f18892ac
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip until Netlify token is configured
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "NETLIFY_AUTH_TOKEN is not configured; deployment skipped."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.NETLIFY_AUTH_TOKEN != ''
        with:
          node-version: "24"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: env.NETLIFY_AUTH_TOKEN != ''
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install function dependencies
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npm install --omit=dev --package-lock=false --prefer-offline --no-audit --no-fund

      - name: Deploy prebuilt site and functions
        if: env.NETLIFY_AUTH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          npx -y netlify-cli@27.8.0 deploy \
            --prod \
            --no-build \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --dir site \
            --functions netlify/functions \
            --message "GitHub $GITHUB_SHA"
